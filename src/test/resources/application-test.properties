spring.datasource.url=jdbc:h2:mem:coffeewiki
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
aws.region=${REGION}

aws.user.pool.id=${USER_POOL_ID}
aws.app.client.id=${APP_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO}/${USER_POOL_ID}

aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}

aws.user.group=${GENERAL_USER_GRP}
