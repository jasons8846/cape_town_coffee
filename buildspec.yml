version: 0.2

env:
  variables:
    FUNCTION_NAME: "capetowncoffee"
    ALIAS_NAME: "live"

phases:

  install:
    runtime-versions:
      java: corretto21
    commands:
      - chmod +x mvnw
      - mkdir -p /tmp/maven-repository

  pre_build:
    commands:
      - echo "Running tests..."
      - ./mvnw -Dmaven.repo.local=/tmp/maven-repository test

      - echo "Getting current Lambda alias version..."
      - CURRENT_VERSION=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" --query 'FunctionVersion' --output text)
      - echo "Current live version: $CURRENT_VERSION"

  build:
    commands:
      - echo "Building application..."
      - ./mvnw -Dmaven.repo.local=/tmp/maven-repository clean package -DskipTests

  post_build:
    commands:
      - echo "=== Publishing new Lambda version ==="

      - echo "Finding Lambda ZIP..."
      - LAMBDA_ZIP=$(find target -maxdepth 1 -name '*-lambda-package.zip' -print -quit)
      - echo "Lambda ZIP: $LAMBDA_ZIP"

      - echo "Updating Lambda function code..."
      - aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file "fileb://$LAMBDA_ZIP"

      - echo "Waiting for Lambda update..."
      - aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - echo "Publishing new Lambda version..."
      - TARGET_VERSION=$(aws lambda publish-version --function-name "$FUNCTION_NAME" --description "CodeBuild ${CODEBUILD_BUILD_NUMBER}" --query 'Version' --output text)

      - echo "Current version: $CURRENT_VERSION"
      - echo "Target version: $TARGET_VERSION"

      - echo "Creating deployment artifact..."
      - mkdir -p deployment

      - echo "Generating appspec.yml..."
      - |
        cat > deployment/appspec.yml <<EOF
        version: 0.0
        
        Resources:
          - TargetService:
              Type: AWS::Lambda::Function
              Properties:
                Name: ${FUNCTION_NAME}
                Alias: ${ALIAS_NAME}
                CurrentVersion: "${CURRENT_VERSION}"
                TargetVersion: "${TARGET_VERSION}"
        EOF

      - cp "$LAMBDA_ZIP" deployment/

      - echo "=== Generated AppSpec ==="
      - cat deployment/appspec.yml

      - echo "=== Deployment directory ==="
      - ls -la deployment

artifacts:
  base-directory: deployment
  files:
    - '**/*'