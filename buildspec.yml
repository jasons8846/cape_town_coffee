version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - chmod +x mvnw
      - mkdir -p /tmp/maven-repository

  pre_build:
    commands:
      - echo "Running tests..."
      - ./mvnw -Dmaven.repo.local=/tmp/maven-repository test

  build:
    commands:
      - echo "Building application..."
      - ./mvnw -Dmaven.repo.local=/tmp/maven-repository clean package -DskipTests

  post_build:
    commands:
      - echo "Creating deployment artifact..."
      - mkdir -p deployment
      - cp appspec.yml deployment/
      - cp target/*-lambda-package.zip deployment/

      - echo "=== Deployment directory ==="
      - ls -la deployment

artifacts:
  base-directory: deployment
  files:
    - '**/*'